<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(function () {
  var root = document.getElementById('fluicom-logo-anim');
  if (!root) return;
  root.classList.add('gsap-anim');

  function initAnimations() {
    var strokes = root.querySelector('#lg-strokes');
    var ring = root.querySelector('#lg-ring');
    var paths = ['lg-p0', 'lg-p1', 'lg-p2', 'lg-p3', 'lg-p4', 'lg-p6', 'lg-p7', 'lg-p8', 'lg-p9'].map(function (id) { return root.querySelector('#' + id); });
    var svg = root.querySelector('svg');

    function prep() {
      var ringLen = ring.getTotalLength();
      ring.style.strokeDasharray = ringLen;
      ring.style.strokeDashoffset = ringLen;
      paths.forEach(function (el) {
        var len = el.getTotalLength();
        el.style.strokeDasharray = len;
        el.style.strokeDashoffset = len;
      });
      gsap.set(strokes, { fillOpacity: 0 });
    }

    function play() {
      prep();
      var bracket = root.querySelector('#lg-p0');
      var rest = paths.filter(function (el) { return el.id !== 'lg-p0'; });
      var tl = gsap.timeline({ defaults: { ease: 'power2.out' } });
      tl.to([ring, bracket], { strokeDashoffset: 0, duration: 0.7, ease: 'power1.inOut' }, 0)
        .to(rest, { strokeDashoffset: 0, duration: 1.3, ease: 'power1.inOut', stagger: 0.09 }, 0.7)
        .to(strokes, { fillOpacity: 1, duration: 0.5, ease: 'power2.out' }, '>-0.2');
    }

    var mm = gsap.matchMedia();
    mm.add(
      { reduced: '(prefers-reduced-motion: reduce)', full: '(prefers-reduced-motion: no-preference)' },
      function (ctx) {
        if (ctx.conditions.full) {
          play();
        } else {
          gsap.set(ring, { strokeDashoffset: 0 });
          gsap.set(paths, { strokeDashoffset: 0 });
          gsap.set(strokes, { fillOpacity: 1 });
        }
      }
    );

    gsap.set(svg, { autoAlpha: 1 });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initAnimations);
  } else {
    initAnimations();
  }
})();
</script>
