<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(function () {
  var root = document.getElementById('fluicom-logo-anim');
  if (!root) return;
  root.classList.add('gsap-anim');

  function initAnimations() {
    var frame = root.querySelector('#lg-frame');
    var letters = root.querySelector('#lg-letters');
    var framePaths = ['lg-border', 'lg-bracket', 'lg-rings'].map(function (id) { return root.querySelector('#' + id); });
    var letterPaths = ['lg-f-m', 'lg-l', 'lg-u', 'lg-i', 'lg-c', 'lg-o'].map(function (id) { return root.querySelector('#' + id); });
    var svg = root.querySelector('svg');

    function prep() {
      framePaths.concat(letterPaths).forEach(function (el) {
        var len = el.getTotalLength();
        el.style.strokeDasharray = len;
        el.style.strokeDashoffset = len;
      });
      gsap.set([frame, letters], { fillOpacity: 0 });
    }

    function play() {
      prep();
      var tl = gsap.timeline({ defaults: { ease: 'power2.out' } });
      tl.to(framePaths, { strokeDashoffset: 0, duration: 1, ease: 'power1.inOut', stagger: 0.12 }, 0)
        .to(frame, { fillOpacity: 1, duration: 0.4, ease: 'power2.out' }, '>-0.15')
        .to(letterPaths, { strokeDashoffset: 0, duration: 1.3, ease: 'power1.inOut', stagger: 0.09 }, 0.6)
        .to(letters, { fillOpacity: 1, duration: 0.5, ease: 'power2.out' }, '>-0.2');
    }

    var mm = gsap.matchMedia();
    mm.add(
      { reduced: '(prefers-reduced-motion: reduce)', full: '(prefers-reduced-motion: no-preference)' },
      function (ctx) {
        if (ctx.conditions.full) {
          play();
        } else {
          gsap.set(framePaths.concat(letterPaths), { strokeDashoffset: 0 });
          gsap.set([frame, letters], { fillOpacity: 1 });
        }
      }
    );

    gsap.set(svg, { autoAlpha: 1 });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initAnimations);
  } else {
    initAnimations();
  }
})();
</script>
