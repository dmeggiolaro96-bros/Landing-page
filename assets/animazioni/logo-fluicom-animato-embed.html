<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@800&display=swap">
<style>
  .fluicom-logo-anim { max-width: 320px; }
  .fluicom-logo-anim.gsap-anim svg { opacity: 0; }
  .fluicom-logo-anim svg { width: 100%; height: auto; display: block; overflow: visible; }
</style>

<div class="fluicom-logo-anim" id="fluicom-logo-anim">
  <svg id="logo" viewBox="0 0 320 100" xmlns="http://www.w3.org/2000/svg">
    <rect id="lg-border" x="5" y="5" width="310" height="90" rx="24"
      fill="none" stroke="#03665a" stroke-width="6" stroke-linecap="round"/>

    <circle id="lg-ring" cx="52" cy="50" r="30" fill="none" stroke="#03665a" stroke-width="7"/>
    <circle id="lg-blue" cx="65" cy="50" r="26" fill="#87bfe0"/>
    <rect id="lg-bar" x="48.5" y="17" width="7" height="66" rx="3.5" fill="#03665a"/>

    <text id="lg-text" x="112" y="68" font-family="'Poppins', sans-serif" font-weight="800"
      font-size="46" fill="#03665a" letter-spacing="-1">
      <tspan class="lg-letter">f</tspan><tspan class="lg-letter">l</tspan><tspan class="lg-letter">u</tspan><tspan class="lg-letter">i</tspan><tspan class="lg-letter">c</tspan><tspan class="lg-letter">o</tspan><tspan class="lg-letter">m</tspan>
    </text>
    <text id="lg-reg" x="303" y="30" font-family="sans-serif" font-weight="500"
      font-size="12" fill="#03665a">&reg;</text>
  </svg>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(function () {
  var root = document.getElementById('fluicom-logo-anim');
  if (!root) return;
  root.classList.add('gsap-anim');

  function initAnimations() {
    var border = root.querySelector('#lg-border');
    var ring = root.querySelector('#lg-ring');
    var blue = root.querySelector('#lg-blue');
    var bar = root.querySelector('#lg-bar');
    var letters = root.querySelectorAll('.lg-letter');
    var reg = root.querySelector('#lg-reg');
    var svg = root.querySelector('svg');

    function prep() {
      [border, ring].forEach(function (el) {
        var len = el.getTotalLength();
        el.style.strokeDasharray = len;
        el.style.strokeDashoffset = len;
      });
      gsap.set(blue, { scale: 0, transformOrigin: '65px 50px' });
      gsap.set(bar, { scaleY: 0, transformOrigin: '50% 50%' });
      gsap.set(letters, { autoAlpha: 0, y: 14 });
      gsap.set(reg, { autoAlpha: 0, scale: 0, transformOrigin: '303px 24px' });
    }

    function play() {
      prep();
      var tl = gsap.timeline({ defaults: { ease: 'power2.out' } });
      tl.to(border, { strokeDashoffset: 0, duration: 0.9, ease: 'power1.inOut' })
        .to(ring, { strokeDashoffset: 0, duration: 0.55, ease: 'power1.inOut' }, 0.55)
        .to(blue, { scale: 1, duration: 0.4, ease: 'back.out(2.4)' }, 0.95)
        .to(bar, { scaleY: 1, duration: 0.3, ease: 'power2.out' }, 1.05)
        .to(letters, { autoAlpha: 1, y: 0, duration: 0.4, stagger: 0.06 }, 1.15)
        .to(reg, { autoAlpha: 1, scale: 1, duration: 0.3, ease: 'back.out(3)' }, '>-0.1');
    }

    var mm = gsap.matchMedia();
    mm.add(
      { reduced: '(prefers-reduced-motion: reduce)', full: '(prefers-reduced-motion: no-preference)' },
      function (ctx) {
        if (ctx.conditions.full) {
          play();
        } else {
          gsap.set([border, ring], { strokeDashoffset: 0 });
          gsap.set(blue, { scale: 1 });
          gsap.set(bar, { scaleY: 1 });
          gsap.set(letters, { autoAlpha: 1, y: 0 });
          gsap.set(reg, { autoAlpha: 1, scale: 1 });
        }
      }
    );

    gsap.set(svg, { autoAlpha: 1 });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initAnimations);
  } else {
    initAnimations();
  }
})();
</script>
