<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<title>Logo Fluicom Animato</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #f4f6f9; --panel: #ffffff; --panel-border: #d7dee6;
    --ink: #1c2a3a; --ink-dim: #5c6b7c; --accent: #03665a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b1420; --panel: #111d2b; --panel-border: #24384c;
      --ink: #e7edf5; --ink-dim: #93a4b8;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b1420; --panel: #111d2b; --panel-border: #24384c;
    --ink: #e7edf5; --ink-dim: #93a4b8;
  }
  html.gsap-anim [data-gsap] { opacity: 0; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    display: flex; flex-direction: column; align-items: center; gap: 18px;
    padding: 40px 20px;
  }
  .eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin: 0; }
  .stage {
    width: 100%; max-width: 480px;
    background-color: #f0f2f5;
    background-image:
      linear-gradient(45deg, #d9dee5 25%, transparent 25%),
      linear-gradient(-45deg, #d9dee5 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #d9dee5 75%),
      linear-gradient(-45deg, transparent 75%, #d9dee5 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    border: 1px solid var(--panel-border); border-radius: 14px; padding: 40px;
  }
  .stage-note {
    font-size: 11px; color: var(--ink-dim); text-align: center; margin: 0;
  }
  svg { width: 100%; height: auto; display: block; overflow: visible; }
  .replay {
    font-family: inherit; font-size: 12px; color: var(--ink-dim);
    background: none; border: 1px solid var(--panel-border); border-radius: 8px;
    padding: 8px 14px; cursor: pointer;
  }
  .replay:hover { color: var(--ink); border-color: var(--accent); }
</style>
</head>

<p class="stage-note" data-gsap>La scacchiera indica trasparenza: il logo non ha nessuno sfondo incorporato, puoi metterlo su qualsiasi colore.</p>
<button class="replay" id="replay-btn" data-gsap>&#8635; Rivedi l'animazione</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(function () {
  document.documentElement.classList.add('gsap-anim');

  function initAnimations() {
    var strokes = document.getElementById('lg-strokes');
    var ring = document.getElementById('lg-ring');
    var paths = ['lg-p1', 'lg-p2', 'lg-p3', 'lg-p4', 'lg-p6', 'lg-p7', 'lg-p8', 'lg-p9'].map(function (id) { return document.getElementById(id); });
    var btn = document.getElementById('replay-btn');

    function prep() {
      [ring].forEach(function (el) {
        var len = el.getTotalLength();
        el.style.strokeDasharray = len;
        el.style.strokeDashoffset = len;
      });
      paths.forEach(function (el) {
        var len = el.getTotalLength();
        el.style.strokeDasharray = len;
        el.style.strokeDashoffset = len;
      });
      gsap.set(strokes, { fillOpacity: 0 });
    }

    function play() {
      prep();
      var tl = gsap.timeline({ defaults: { ease: 'power2.out' } });
      tl.to(ring, { strokeDashoffset: 0, duration: 0.7, ease: 'power1.inOut' }, 0)
        .to(paths, { strokeDashoffset: 0, duration: 1.3, ease: 'power1.inOut', stagger: 0.09 }, 0.7)
        .to(strokes, { fillOpacity: 1, duration: 0.5, ease: 'power2.out' }, '>-0.2');
      return tl;
    }

    var mm = gsap.matchMedia();
    mm.add(
      { reduced: '(prefers-reduced-motion: reduce)', full: '(prefers-reduced-motion: no-preference)' },
      function (ctx) {
        if (ctx.conditions.full) {
          play();
          btn.addEventListener('click', play);
        } else {
          gsap.set(ring, { strokeDashoffset: 0 });
          gsap.set(paths, { strokeDashoffset: 0 });
          gsap.set(strokes, { fillOpacity: 1 });
        }
      }
    );

    gsap.set('[data-gsap]', { autoAlpha: 1 });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initAnimations);
  } else {
    initAnimations();
  }
})();
</script>

</html>
