<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<title>Logo Fluicom Animato</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  :root {
    --bg: #f4f6f9; --panel: #ffffff; --panel-border: #d7dee6;
    --ink: #1c2a3a; --ink-dim: #5c6b7c; --accent: #03665a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b1420; --panel: #111d2b; --panel-border: #24384c;
      --ink: #e7edf5; --ink-dim: #93a4b8;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b1420; --panel: #111d2b; --panel-border: #24384c;
    --ink: #e7edf5; --ink-dim: #93a4b8;
  }
  html.gsap-anim [data-gsap] { opacity: 0; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    display: flex; flex-direction: column; align-items: center; gap: 18px;
    padding: 40px 20px;
  }
  .eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin: 0; }
  .stage {
    width: 100%; max-width: 480px;
    background-color: #f0f2f5;
    background-image:
      linear-gradient(45deg, #d9dee5 25%, transparent 25%),
      linear-gradient(-45deg, #d9dee5 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #d9dee5 75%),
      linear-gradient(-45deg, transparent 75%, #d9dee5 75%);
    background-size: 20px 20px;
    background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
    border: 1px solid var(--panel-border); border-radius: 14px; padding: 40px;
  }
  .stage-note {
    font-size: 11px; color: var(--ink-dim); text-align: center; margin: 0;
  }
  svg { width: 100%; height: auto; display: block; overflow: visible; }
  .replay {
    font-family: inherit; font-size: 12px; color: var(--ink-dim);
    background: none; border: 1px solid var(--panel-border); border-radius: 8px;
    padding: 8px 14px; cursor: pointer;
  }
  .replay:hover { color: var(--ink); border-color: var(--accent); }
</style>
</head>
<body>

<p class="eyebrow" data-gsap>Fluicom &middot; logo intro</p>

<div class="stage" data-gsap>
  <svg id="logo" viewBox="0 0 320 100" xmlns="http://www.w3.org/2000/svg">
    <!-- bordo -->
    <rect id="lg-border" x="5" y="5" width="310" height="90" rx="24"
      fill="none" stroke="#03665a" stroke-width="6" stroke-linecap="round"/>

    <!-- icona: anello teal (dietro) + cerchio azzurro pieno + barra verticale (sopra, a coprire la giunzione) -->
    <circle id="lg-ring" cx="56" cy="50" r="30" fill="none" stroke="#03665a" stroke-width="7"/>
    <circle id="lg-blue" cx="56" cy="50" r="26.5" fill="#87bfe0"/>
    <rect id="lg-bar" x="52.5" y="17" width="7" height="66" rx="3.5" fill="#03665a"/>

    <!-- testo, una lettera per tspan (animate separatamente) -->
    <text id="lg-text" x="112" y="68" font-family="'Poppins', sans-serif" font-weight="800"
      font-size="46" fill="#03665a" letter-spacing="-1">
      <tspan class="lg-letter">f</tspan><tspan class="lg-letter">l</tspan><tspan class="lg-letter">u</tspan><tspan class="lg-letter">i</tspan><tspan class="lg-letter">c</tspan><tspan class="lg-letter">o</tspan><tspan class="lg-letter">m</tspan>
    </text>
    <text id="lg-reg" x="303" y="30" font-family="'IBM Plex Mono', monospace" font-weight="500"
      font-size="12" fill="#03665a">&reg;</text>
  </svg>
</div>

<p class="stage-note" data-gsap>La scacchiera indica trasparenza: il logo non ha nessuno sfondo incorporato, puoi metterlo su qualsiasi colore.</p>
<button class="replay" id="replay-btn" data-gsap>&#8635; Rivedi l'animazione</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script>
(function () {
  document.documentElement.classList.add('gsap-anim');

  function initAnimations() {
    var border = document.getElementById('lg-border');
    var ring = document.getElementById('lg-ring');
    var blue = document.getElementById('lg-blue');
    var bar = document.getElementById('lg-bar');
    var letters = document.querySelectorAll('.lg-letter');
    var reg = document.getElementById('lg-reg');
    var btn = document.getElementById('replay-btn');

    function prep() {
      [border, ring].forEach(function (el) {
        var len = el.getTotalLength();
        el.style.strokeDasharray = len;
        el.style.strokeDashoffset = len;
      });
      gsap.set(blue, { scale: 0, transformOrigin: '56px 50px' });
      gsap.set(bar, { scaleY: 0, transformOrigin: '50% 50%' });
      gsap.set(letters, { autoAlpha: 0, y: 14 });
      gsap.set(reg, { autoAlpha: 0, scale: 0, transformOrigin: '303px 24px' });
    }

    function play() {
      prep();
      var tl = gsap.timeline({ defaults: { ease: 'power2.out' } });
      tl.to(border, { strokeDashoffset: 0, duration: 0.9, ease: 'power1.inOut' })
        .to(ring, { strokeDashoffset: 0, duration: 0.55, ease: 'power1.inOut' }, 0.55)
        .to(blue, { scale: 1, duration: 0.4, ease: 'back.out(2.4)' }, 0.95)
        .to(bar, { scaleY: 1, duration: 0.3, ease: 'power2.out' }, 1.05)
        .to(letters, { autoAlpha: 1, y: 0, duration: 0.4, stagger: 0.06 }, 1.15)
        .to(reg, { autoAlpha: 1, scale: 1, duration: 0.3, ease: 'back.out(3)' }, '>-0.1');
      return tl;
    }

    var mm = gsap.matchMedia();
    mm.add(
      { reduced: '(prefers-reduced-motion: reduce)', full: '(prefers-reduced-motion: no-preference)' },
      function (ctx) {
        if (ctx.conditions.full) {
          play();
          btn.addEventListener('click', play);
        } else {
          gsap.set([border, ring], { strokeDashoffset: 0 });
          gsap.set(blue, { scale: 1 });
          gsap.set(bar, { scaleY: 1 });
          gsap.set(letters, { autoAlpha: 1, y: 0 });
          gsap.set(reg, { autoAlpha: 1, scale: 1 });
        }
      }
    );

    gsap.set('[data-gsap]', { autoAlpha: 1 });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initAnimations);
  } else {
    initAnimations();
  }
})();
</script>
</body>
</html>
